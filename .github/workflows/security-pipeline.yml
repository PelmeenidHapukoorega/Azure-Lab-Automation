name: Security Pipeline = Lab 07

on:
  push:
    paths:
      - 'Labs/07-Security-Pipeline/**'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3 

      - name: Run checkov security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: Labs/07-Security-Pipeline/terraform
          framework: terraform
          soft_fail: false

  deploy:
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: terraform setup 
        uses: hashicorp/setup-terraform@v3

      - name: terraform init
        working-directory : Labs/07-Security-Pipeline/terraform
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init

      - name: terraform apply
        working-directory: Labs/07-Security-Pipeline/terraform
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: terraform apply -auto-approve
