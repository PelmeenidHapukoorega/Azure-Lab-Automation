name: LogistikaOI CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'ScenarioBased/LogistikaOÜ/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Get ACR name
        id: acr
        run: |
          ACR_NAME=$(az acr list --resource-group Log-OU-rg --query "[0].name" -o tsv)
          ACR_NAME_LOWER=$(echo "$ACR_NAME" | tr '[:upper:]' '[:lower:]')
          echo "acr_name=$ACR_NAME_LOWER" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        run: az acr login --name ${{ steps.acr.outputs.acr_name }}

      - name: Build and push image
        run: |
          docker build -t ${{ steps.acr.outputs.acr_name }}.azurecr.io/fleettracker:latest ./ScenarioBased/LogistikaOÜ/testapp
          docker push ${{ steps.acr.outputs.acr_name }}.azurecr.io/fleettracker:latest